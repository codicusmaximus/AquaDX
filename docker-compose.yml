services:
  app:
    build: .
    # Built locally from this folder (run `docker compose up -d --build` after updating)
    image: localhost/aquadx-local:latest
    pull_policy: build
    ports:
      # Web UI and game traffic. Cabinets send their first boot request (ALL.Net PowerOn) to port 80,
      # so keep 80 unless something else forwards port 80 here. Change it with AQUADX_PORT in a .env file.
      - "${AQUADX_PORT:-80}:${AQUADX_PORT:-80}"
      - "8443:8443"
      - "22345:22345"
    restart: on-failure:3
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/main
      - SPRING_DATASOURCE_USERNAME=cat
      - SPRING_DATASOURCE_PASSWORD=meow
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.mariadb.jdbc.Driver
      # LAN mode: host the web UI and log in by card, no email or accounts needed.
      # Set to false for a public server.
      - AQUANET_LAN_ENABLED=true
      # Serve on AQUADX_PORT, and include it in the game URLs handed to cabinets at boot (port 80 is left out)
      - SERVER_PORT=${AQUADX_PORT:-80}
      - ALLNET_SERVER_PORT=${AQUADX_PORT:-80}
      - ALLNET_SERVER_HIDE_PORT=false
    depends_on:
      - db
    volumes:
      # ":z" lets the container read these folders on SELinux systems like Fedora (ignored elsewhere)
      - ./config:/app/config:z
      - ./data:/app/data:z
  db:
    image: docker.io/library/mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: meow
      MYSQL_DATABASE: main
      MYSQL_USER: cat
      MYSQL_PASSWORD: meow
    ports:
      - "${AQUADX_DB_PORT:-127.0.0.1:3369}:3306"
    volumes:
      - "${AQUADX_DB_DATA:-mariadb_data}:/var/lib/mysql"

volumes:
  mariadb_data:
