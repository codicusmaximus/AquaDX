services:
  app:
    build: .
    # Built locally from this folder (run `docker compose up -d --build` after updating)
    image: localhost/aquadx-local:latest
    pull_policy: build
    ports:
      # Web UI and game traffic
      - "8011:8011"
      # Cabinets always send their first boot request (ALL.Net PowerOn) to port 80.
      # Uncomment this where port 80 is free, or redirect port 80 to 8011 in your firewall (see docs/home-setup.md).
      # - "80:8011"
      - "8443:8443"
      - "22345:22345"
    restart: on-failure:3
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/main
      - SPRING_DATASOURCE_USERNAME=cat
      - SPRING_DATASOURCE_PASSWORD=meow
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.mariadb.jdbc.Driver
      # LAN mode: host the web UI on port 8011 and log in by card, no email or accounts needed.
      # Set to false for a public server.
      - AQUANET_LAN_ENABLED=true
      # Serve on port 8011, and include that port in the game URLs handed to cabinets at boot
      - SERVER_PORT=8011
      - ALLNET_SERVER_PORT=8011
      - ALLNET_SERVER_HIDE_PORT=false
    depends_on:
      - db
    volumes:
      # ":z" lets the container read these folders on SELinux systems like Fedora (ignored elsewhere)
      - ./config:/app/config:z
      - ./data:/app/data:z
  db:
    image: docker.io/library/mariadb:latest
    environment:
      MYSQL_ROOT_PASSWORD: meow
      MYSQL_DATABASE: main
      MYSQL_USER: cat
      MYSQL_PASSWORD: meow
    ports:
      - "${AQUADX_DB_PORT:-127.0.0.1:3369}:3306"
    volumes:
      - "${AQUADX_DB_DATA:-mariadb_data}:/var/lib/mysql"

volumes:
  mariadb_data:
